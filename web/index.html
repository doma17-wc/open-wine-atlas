<style>
/* Layout: full-bleed dark map; a quiet left rail (title, search, places, legend) and a detail sheet
   that slides in from the right on desktop and up from the bottom on phones. One committed dark look. */
:root {
  color-scheme: dark;
  --night: #0b0b0d;        /* page and sea */
  --land: #151518;         /* land fill */
  --panel: rgba(17,17,20,.92);
  --line: #2a2a31;         /* hairlines */
  --parchment: #e6dccb;    /* primary text, appellation outlines */
  --muted: #8d877c;        /* secondary text */
  --gold: #e7c06a;         /* top classification: grand cru, DOCG, DOCa, pago */
  --copper: #cf8f5f;       /* premier cru */
  --slate: #9db0c0;        /* German Einzellagen */
  --vine: #7f9b6f;         /* vineyard areas */
  --focus: #fff8ea;
  --f-display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--parchment); font: 14px/1.5 var(--f-body); overflow: hidden; }
#map { position: absolute; inset: 0; background: var(--night); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- left rail */
.rail { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; width: min(340px, calc(100% - 32px));
  display: flex; flex-direction: column; gap: 10px; z-index: 3; max-height: calc(100% - 32px); }
.brand { padding: 14px 16px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px); }
.brand h1 { margin: 0; font: 600 30px/1 var(--f-display); letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; }
.brand .count { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--parchment); }

.search { position: relative; }
.search input { width: 100%; box-sizing: border-box; padding: 12px 14px 12px 38px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); outline: none; backdrop-filter: blur(10px); }
.search input:focus { border-color: #4a4740; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: .55; }
.results { list-style: none; margin: 6px 0 0; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  max-height: 46vh; overflow: auto; backdrop-filter: blur(10px); }
.results li button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
  padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.results li button:hover, .results li button[aria-selected="true"] { background: #222228; }
.results .n { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .m { grid-column: 1; color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .c { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 500 11px var(--f-mono); color: var(--muted); }

.countries { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); cursor: pointer; font-size: 12.5px;
  backdrop-filter: blur(10px); }
.chip:hover { border-color: #57534a; }
.chip .k { font: 500 10.5px var(--f-mono); color: var(--muted); margin-right: 5px; }

.legend { padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px);
  display: grid; gap: 7px; font-size: 12.5px; }
.legend label { display: grid; grid-template-columns: 18px 1fr; align-items: center; gap: 8px; cursor: pointer; }
.legend input { position: absolute; opacity: 0; pointer-events: none; }
.sw { width: 16px; height: 10px; border-radius: 2px; border: 1.5px solid currentColor; box-sizing: border-box; }
.legend input:not(:checked) + .sw { opacity: .25; }
.legend input:not(:checked) ~ span { color: var(--muted); text-decoration: line-through; text-decoration-color: #555; }
.legend input:focus-visible + .sw { outline: 2px solid var(--focus); outline-offset: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-left: 4px; }
.legend .hd { font: 500 10.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.rail-foot { display: flex; gap: 6px; flex-wrap: wrap; }
.link-btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); cursor: pointer; font-size: 12.5px; }
.link-btn:hover { border-color: #57534a; }

/* ---------- detail sheet */
.sheet { position: absolute; z-index: 4; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; bottom: 16px; width: min(380px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(12px);
  display: flex; flex-direction: column; transform: translateX(calc(100% + 24px)); transition: transform .32s cubic-bezier(.2,.7,.2,1); }
.sheet.open { transform: none; }
.sheet header { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.eyebrow { font: 500 10.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.sheet h2 { margin: 0; font: 600 32px/1.02 var(--f-display); text-wrap: balance; overflow-wrap: anywhere; }
.crumbs { color: var(--muted); font-size: 12.5px; }
.crumbs button { all: unset; cursor: pointer; color: var(--parchment); border-bottom: 1px solid #4a463f; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; font: 500 11px var(--f-mono);
  border: 1px solid currentColor; width: fit-content; }
.badge.top { color: var(--gold); } .badge.pc { color: var(--copper); } .badge.std { color: var(--parchment); } .badge.de { color: var(--slate); }
.sheet .body { padding: 14px 18px 18px; overflow: auto; display: grid; gap: 16px; align-content: start; min-height: 0; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; }
.facts dt { color: var(--muted); font-size: 12.5px; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.grapes { display: flex; flex-wrap: wrap; gap: 5px; }
.grapes span { padding: 2px 7px; border: 1px solid var(--line); border-radius: 5px; font-size: 12px; }
.sec h3 { margin: 0 0 6px; font: 500 10.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.communes { color: #bdb4a5; font-size: 13px; }
.source { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.source a { color: var(--parchment); }
.x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
  background: transparent; cursor: pointer; display: grid; place-items: center; }
.x:hover { border-color: #57534a; }
.sub-list { display: grid; gap: 2px; }
.sub-list button { all: unset; cursor: pointer; padding: 4px 0; display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed #2a2a31; font-size: 13px; }
.sub-list button:hover { color: var(--focus); }
.sub-list .r { font: 500 10.5px var(--f-mono); color: var(--muted); }
.primary { justify-self: start; padding: 8px 12px; border-radius: 8px; border: 1px solid #4a463f; background: #1d1c1f; cursor: pointer; }
.primary:hover { border-color: var(--parchment); }


/* ---------- richer place sheet */
.lede { margin: 0; font: 400 15px/1.55 var(--f-body); color: #ddd3c2; }
.atlas-note { border-left: 2px solid var(--gold); padding: 2px 0 2px 12px; display: grid; gap: 4px; }
.atlas-note .an-h { font: 500 10.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.atlas-note p { margin: 0; font: italic 500 17px/1.4 var(--f-display); color: var(--parchment); }
.atlas-note .an-f { font-size: 11.5px; color: var(--muted); }
.q { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #4a463f;
  font: 500 10px var(--f-mono); color: var(--muted); vertical-align: middle; margin-left: 4px; }
.q:hover, .q:focus-visible { color: var(--parchment); border-color: var(--parchment); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 70px 36px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar .bl { min-width: 0; }
.bar .bt { height: 6px; background: #24242a; border-radius: 3px; overflow: hidden; }
.bar .bt i { display: block; height: 100%; background: var(--copper); }
.bar .num { text-align: right; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { all: unset; cursor: pointer; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; }
.chips button:hover, .chips button:focus-visible { border-color: var(--parchment); }
.chips small { color: var(--gold); font: 500 10px var(--f-mono); }
.wine { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.wine:first-of-type { border-top: 0; padding-top: 2px; }
.wh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.wh b { font-weight: 500; }
.wchip { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; transform: translateY(-1px); }
.wk { color: var(--muted); font-size: 12px; }
.wn { font: 400 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.sec2 summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.sec2[open] summary { margin-bottom: 6px; }
.gdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; transform: translateY(-1px); }
.wlist { display: grid; gap: 3px; font-size: 13px; }
.wlist a, .links a { color: var(--parchment); text-decoration-color: #4a463f; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; text-decoration: none; }
.links a:hover { border-color: var(--parchment); }
.gloss dt { font: 600 19px/1.2 var(--f-display); margin-top: 10px; color: var(--parchment); }
.gloss dd { margin: 4px 0 0; color: #c9c0b1; }
.gloss h3 { margin: 16px 0 0; font: 500 10.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- modal for "Open data" and "Suggest" */
.modal { position: absolute; inset: 0; z-index: 6; background: rgba(5,5,6,.6); display: grid; place-items: center; padding: 16px; }
.modal .card { width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; background: #131316; border: 1px solid var(--line);
  border-radius: 12px; padding: 22px; position: relative; display: grid; gap: 12px; }
.modal h2 { margin: 0; font: 600 28px/1.1 var(--f-display); }
.modal p { margin: 0; color: #c9c0b1; max-width: 62ch; }
.modal table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.modal td, .modal th { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.modal th { font: 500 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tbl { overflow-x: auto; }
.modal a { color: var(--parchment); }
form.suggest { display: grid; gap: 10px; }
form.suggest label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
form.suggest input, form.suggest textarea, form.suggest select { background: #1b1b1f; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--parchment); }
form.suggest textarea { min-height: 90px; resize: vertical; }
.note { font-size: 12.5px; color: var(--muted); }
.queue { display: grid; gap: 6px; }
.queue div { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; }
.queue b { font-weight: 500; }

/* ---------- loading + attribution + hover tag */
.loading { position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5;
  padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font: 500 12px var(--f-mono); color: var(--muted); }
.attrib { position: absolute; right: 16px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 2; font-size: 11px; color: #6f6a62;
  max-width: calc(100% - 32px); text-align: right; }
.attrib button { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: #4a463f; }
.sheet.open ~ .attrib { right: 412px; }
.tag { position: absolute; z-index: 3; pointer-events: none; padding: 5px 9px; border-radius: 6px; background: rgba(10,10,12,.92);

// ---------- terrain of a place: elevation, slope and aspect, measured in the browser from the elevation tiles
const TERRAIN = new Map(); // id -> stats
const SECTORS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];

const latOfY = (y) => Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180 / Math.PI;

function nextIdle() {
  return new Promise((res) => {
    requestAnimationFrame(() => {
      if (!map.isMoving() && !map.isEasing() && map.areTilesLoaded()) res(); else map.once("idle", res);
    });
  });
}
// every outline fragment of the place in the loaded vector tiles (parcel-level files win over the overview)
function geometryFor(id) {
  const detail = [], ov = [];
  const srcs = Object.entries(map.getStyle().sources).filter(([k, v]) => v.type === "vector" && k !== "base" && k !== "poi").map(([k]) => k);
  for (const s of srcs) for (const sl of ["appellations", "crus", "grosslagen"]) {
    let fs = [];
    try { fs = map.querySourceFeatures(s, { sourceLayer: sl, filter: ["==", ["get", "id"], id] }); } catch (e) {}
    fs.forEach((f) => { if (/Polygon/.test(f.geometry.type)) (s === "ov" ? ov : detail).push(f.geometry); });
  }

}
const polysOf = (g) => g.type === "Polygon" ? [g.coordinates] : g.coordinates;

async function loadDem(z, tx0, ty0, nx, ny) {
  const W = nx * DEM_TILE, H = ny * DEM_TILE;
  const cv = typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(W, H) : Object.assign(document.createElement("canvas"), { width: W, height: H });
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  const jobs = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const url = DEM_URL.replace("{z}", z).replace("{x}", tx0 + i).replace("{y}", ty0 + j);
    jobs.push(fetch(url).then((r) => r.ok ? r.blob() : null).then((b) => b && createImageBitmap(b))
      .then((img) => { if (img) ctx.drawImage(img, i * DEM_TILE, j * DEM_TILE, DEM_TILE, DEM_TILE); return !!img; }).catch(() => false));
  }

async function fillTerrain(p, token) {
  const el = () => (token === sheetToken ? $("terrain-sec") : null);

    await nextIdle();
    const t = await measureTerrain(p.id);
    const box = el();
    if (!box) return;
    if (!t) { box.innerHTML = '<h3>Terrain</h3><p class="note">Zoom in on the place to measure its terrain.</p>'; return null; }
    const pct = (v) => Math.round(v * 100);
    const rows = [
      ["Elevation", '<span class="num">' + fmtN(t.min) + "–" + fmtN(t.max) + " m</span>"],
      ["Mean elevation", '<span class="num">' + fmtN(t.mean) + " m</span>"],
    ];
    const fine = t.res <= 35;
    if (fine && t.slope != null) {

      rows.push(["Steepest tenth", '<span class="num">above ' + fmtN(t.slopeP90, 0) + "°</span>"]);

      (fine ? roseSvg(t) : "") +

function setState(f, key, val) {
  if (!f) return;
  try { map.setFeatureState({ source: f.source, sourceLayer: f.sourceLayer, id: f.id }, { [key]: val }); } catch (e) {}
}
const PRI = { vineyard: 0, subzone: 1, appellation: 2, region: 3 };
function pick(point) {
  const layers = [...pickLayers].filter((l) => map.getLayer(l) && map.getLayoutProperty(l, "visibility") !== "none");
  const fs = map.queryRenderedFeatures(point, { layers });
  fs.sort((a, b) => (PRI[a.properties.level] ?? 9) - (PRI[b.properties.level] ?? 9));
  return fs[0] || null;
}
const tag = $("tag");
map.on("mousemove", (e) => {
  const f = pick(e.point);
  if (hovered && (!f || f.id !== hovered.id)) { setState(hovered, "hover", false); hovered = null; }
  if (f) {
    if (!hovered) { hovered = f; setState(f, "hover", true); }
    map.getCanvas().style.cursor = "pointer";
    const p = f.properties;
    tag.innerHTML = esc(p.name) + "<small>" + esc(RANK_LABEL[p.rank] || LEVEL_LABEL[p.level] || "") + "</small>";
    tag.style.left = e.point.x + "px"; tag.style.top = e.point.y + "px"; tag.hidden = false;
  } else { map.getCanvas().style.cursor = ""; tag.hidden = true; }
});
map.on("mouseout", () => { tag.hidden = true; });
map.on("click", (e) => {
  const f = pick(e.point);
  if (f) select(f.properties, f); else closeSheet();
});

function clearSelected() {
  if (selected) selected.forEach((s) => setState(s, "selected", false));
  selected = null;
}
function markSelected(id) {
  clearSelected();
  const srcs = Object.entries(map.getStyle().sources).filter(([k, v]) => v.type === "vector" && k !== "base" && k !== "poi").map(([k]) => k);
  selected = [];
  srcs.forEach((s) => ["appellations", "crus", "grosslagen"].forEach((sl) => {
    const f = { source: s, sourceLayer: sl, id };
    try { map.setFeatureState(f, { selected: true }); selected.push(f); } catch (e) {}
  }));
}

// ---------- search index + details
let INDEX = [], byId = new Map(), byName = new Map(), children = new Map();
const details = {};
function getDetails(cc) {
  if (!details[cc]) details[cc] = fetch("data/details-" + cc.toLowerCase() + ".json").then((r) => r.json()).catch(() => ({}));
  return details[cc];
}

function shortName(name, parent) {
  if (parent && name.startsWith(parent + " ") && name.length > parent.length + 1) {
    return name.slice(parent.length + 1).replace(/^premier cru /, "").replace(/^grand cru /, "");
  }
  return name;
}

async function select(p, feature) {
  const rec = byId.get(p.id);
  markSelected(p.id);
  const all = await getDetails(p.country);
  const d = all[p.id] || {};
  // climats inherit the wine rules of their appellation
  const parentRec = p.parent ? byName.get(norm(p.parent)) : null;
  const pd = parentRec ? ((await getDetails(parentRec[2]))[parentRec[1]] || {}) : {};
  renderSheet(p, d, rec, pd, parentRec);
  if (!feature && rec) fitTo(rec[6], p.level);
  if (WEB) {
    const tok = sheetToken;
    fillTerrain(p, tok).then((t) => fillClimate(p, d, rec, tok, t));
    fillVintages(p, d, pd, tok);
    fillSoil(p, d, rec, tok);
    fillWiki(p, tok);
    try { history.replaceState(null, "", "#" + encodeURIComponent(p.id)); } catch (e) {}
  }
}
function fitTo(b, level) {
  const maxZ = { vineyard: 15, subzone: 13.5, appellation: 12.5, region: 9 }[level] || 13;
  const wide = innerWidth > 760;
  map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: { top: 60, bottom: wide ? 60 : innerHeight * 0.5, left: wide ? 380 : 30, right: wide ? 420 : 30 }, maxZoom: maxZ, duration: 1400, essential: true });
}

function badgeFor(p) {
  const g = (k) => ' <button class="q" data-gloss="' + k + '" aria-label="What does this mean?">?</button>';
  if (TOP.includes(p.rank)) return '<span class="badge top">' + esc(RANK_LABEL[p.rank]) + "</span>" + g(p.rank);
  if (p.rank === "premier_cru") return '<span class="badge pc">Premier cru</span>' + g("premier_cru");
  if (p.country === "DE" && p.level === "vineyard") return '<span class="badge de">Einzellage</span>' + g("einzellage");
  if (p.country === "US") return '<span class="badge std">AVA' + (p.level === "subzone" ? " · nested" : "") + "</span>" + g("ava");
  return '<span class="badge std">' + esc(LEVEL_LABEL[p.level] || p.level) + "</span>" + g(p.level);
}

// OIV grape names end with a colour code: N noir, B blanc, G gris, Rs/Rg rose/rouge
const GRAPE_COLOUR = { N: "#7d2a35", B: "#d8c98f", G: "#a99a8c", Rs: "#c98a8a", Rg: "#a8505a" };
function grape(g) {
  const m = String(g).trim().match(/^(.*?)\s+(N|B|G|Rs|Rg)$/);
  const name = m ? m[1] : String(g).trim(), c = m ? GRAPE_COLOUR[m[2]] : null;
  return "<span>" + (c ? '<i class="gdot" style="background:' + c + '"></i>' : "") + esc(name) + "</span>";
}
const COLOUR_CHIP = { Red: "#8e3040", White: "#d9c88a", "Rosé": "#d39aa0", Rose: "#d39aa0", Other: "#8d877c" };
const num = (v) => v == null ? null : Number(String(v).replace(",", "."));
const fmtN = (v, d = 0) => { const n = num(v); return n == null || isNaN(n) ? esc(v) : n.toLocaleString("en-US", { maximumFractionDigits: d }); };
const fmtList = (a) => a.length <= 2 ? a.join(" and ") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];

function summary(p, d, pd) {
  const kind = !RANK_LABEL[p.rank] ? "" : p.rank.endsWith("_cru") ? RANK_LABEL[p.rank].toLowerCase() : RANK_LABEL[p.rank];
  const lvl = { region: "wine region", appellation: "appellation", subzone: "named sub-zone", vineyard: p.country === "DE" ? "registered vineyard site (Einzellage)" : "climat" }[p.level] || "place";
  let t = esc(p.name) + " is " + (/^[aeiou]/i.test(kind || lvl) && !/^(DOC|DOCa|DOCG)/.test(kind) ? "an " : "a ") + (kind ? kind + " " : "") + lvl;
  if (p.parent) t += " of " + esc(p.parent);
  t += " in " + esc(COUNTRY_EN[p.country] || p.country);
  const area = d.area_ha ?? null;
  if (area) t += ", covering " + fmtN(area, 1) + " ha";
  const towns = d.gemarkungen?.length ? d.gemarkungen : d.communes;
  if (towns?.length && towns.length <= 3) t += " in " + esc(fmtList(towns));
  else if (towns?.length) t += " across " + towns.length + " communes";
  t += ".";
  if (d.share_of_parent) t += " That is " + d.share_of_parent + "% of the " + esc(p.parent) + " appellation area.";
  if (d.share_of_grosslage) t += " It makes up " + d.share_of_grosslage + "% of the Großlage " + esc(d.grosslage) + ".";
  const wines = d.wines || pd.wines;
  if (wines?.length) {
    const cols = [...new Set(wines.map((w) => w.colour).filter(Boolean))].map((c) => c.toLowerCase());
    const mains = [...new Set(wines.flatMap((w) => w.main || []))].map((g) => g.replace(/\s+(N|B|G|Rs|Rg)$/, ""));
    if (cols.length) t += " The rules allow " + fmtList(cols) + " wine";
    if (mains.length && mains.length <= 4) t += ", based on " + esc(fmtList(mains));
    if (cols.length) t += ".";
  }
  if (d.bedrock?.length) t += " Regional bedrock: " + esc(d.bedrock[0][0].replace(/ \(.*\)/, "").toLowerCase()) + ".";
  return t;
}

function wineTable(wines) {
  return wines.map((w) => {
    const main = (w.main || []).map(grape).join("");
    const sec = (w.secondary || []);
    return '<div class="wine"><div class="wh"><b><i class="wchip" style="background:' + (COLOUR_CHIP[w.colour] || COLOUR_CHIP.Other) + '"></i>' + esc(w.wine) + "</b>" +
      '<span class="wk">' + esc([w.colour, w.category !== "Wine" ? w.category : ""].filter(Boolean).join(" · ")) + "</span></div>" +
      (main ? '<div class="grapes">' + main + "</div>" : "") +
      (sec.length ? '<details class="sec2"><summary>Also allowed · ' + (w.secondary_total || sec.length) + "</summary><div class=\"grapes\">" + sec.map(grape).join("") +
        (w.secondary_total > sec.length ? "<span>+" + (w.secondary_total - sec.length) + "</span>" : "") + "</div></details>" : "") +
      '<div class="wn">' + [w.yield_hl ? "max " + fmtN(w.yield_hl, 1) + " hl/ha" : "", w.yield_kg ? fmtN(w.yield_kg) + " kg/ha" : "", w.density ? "min " + fmtN(w.density) + " vines/ha" : ""].filter(Boolean).join(" · ") + "</div></div>";
  }).join("");
}

let sheetToken = 0;

  $("sh-head").innerHTML =

  if (d.communes && d.communes.length && d.gemarkungen) rows.push(["Gemeinde", esc(d.communes.join(", "))]);
  if (d.bereich) rows.push(["Bereich", esc(d.bereich)]);
  if (d.region) rows.push(["Anbaugebiet", esc(d.region)]);
  if (d.wine_region) rows.push(["Wine region", esc(d.wine_region)]);

  if (d.petitioner) rows.push(["Petitioned by", esc(d.petitioner)]);
  if (d.cfr) rows.push(["Legal text", d.cfr_url ? '<a href="' + esc(d.cfr_url) + '" target="_blank" rel="noopener">' + esc(d.cfr) + "</a>" : esc(d.cfr)]);

  }

      (kids.length > 120 ? '<span class="note">and ' + (kids.length - 120) + " more. Use search to find them.</span>" : "") + "</div></div>";

function closeSheet() { $("sheet").classList.remove("open"); clearSelected(); sheetToken++; if (WEB) try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
$("close").onclick = closeSheet;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!$("modal").hidden) closeModal(); else closeSheet(); } });

});
function goTo(r) {
  const p = { name: r[0], id: r[1], country: r[2], level: r[3], rank: r[4], parent: r[5], src: srcOf(r[1]) };
  select(p, null);
}
const srcOf = (id) => id.split("-")[1] === "canton" ? "bfs" : id.split("-")[1];

// ---------- search
const qEl = $("q"), resEl = $("results");
let active = -1, current = [];
function search(q) {
  const n = norm(q);
  if (n.length < 2) return [];
  const words = n.split(" ");
  const out = [];
  for (const r of INDEX) {
    const key = r._k;
    // German site names are written "Wehlener Sonnenuhr": match "wehlener" against the village "Wehlen"
    if (!words.every((w) => key.includes(w) || (w.length > 5 && w.endsWith("er") && key.includes(w.slice(0, -2))))) continue;
    const nameKey = norm(r[0]);
    let s = nameKey.startsWith(n) ? 0 : nameKey.includes(" " + n) ? 1 : 2;
    s += ({ region: 0, appellation: 0.2, subzone: 0.5, vineyard: 0.6 }[r[3]] ?? 1);
    s += key.length / 200;
    out.push([s, r]);
    if (out.length > 600) break;
  }
  return out.sort((a, b) => a[0] - b[0]).slice(0, 30).map((x) => x[1]);
}
function renderResults() {
  if (!current.length) { resEl.hidden = !qEl.value.trim(); resEl.innerHTML = qEl.value.trim() ? '<li class="note" style="padding:8px 10px">No place found. Try another spelling.</li>' : ""; return; }
  resEl.innerHTML = current.map((r, i) => '<li><button role="option" aria-selected="' + (i === active) + '" data-i="' + i + '"><span class="n">' + esc(r[0]) +
    '</span><span class="m">' + esc(RANK_LABEL[r[4]] || LEVEL_LABEL[r[3]]) + (r[7] ? " · " + esc(r[7].split(", ")[0]) : "") + (r[5] ? " · " + esc(r[5]) : "") + '</span><span class="c">' + r[2] + "</span></button></li>").join("");
  resEl.hidden = false;
}
qEl.addEventListener("input", () => { current = search(qEl.value); active = -1; renderResults(); });
qEl.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { active = Math.min(active + 1, current.length - 1); renderResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); renderResults(); e.preventDefault(); }
  else if (e.key === "Enter" && current.length) { choose(current[Math.max(active, 0)]); }
});
resEl.addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) choose(current[+b.dataset.i]); });
function choose(r) { resEl.hidden = true; qEl.value = r[0]; qEl.blur(); goTo(r); }
document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".search")) resEl.hidden = true; });

// ---------- country chips, legend
document.querySelectorAll(".chip[data-c]").forEach((b) => b.onclick = () => {
  const v = VIEWS[b.dataset.c];
  map.fitBounds(v, { padding: { top: 40, bottom: 40, left: innerWidth > 760 ? 370 : 20, right: 20 }, duration: 1300 });
});
$("moreBtn").onclick = () => { const r = $("rail"); r.classList.toggle("more"); $("moreBtn").setAttribute("aria-expanded", r.classList.contains("more")); };
const GROUPS = { app: "lg-app", top: "lg-top", pc: "lg-pc", de: "lg-de", vine: "lg-vine", win: "lg-win" };
function applyLegend() {
  const on = (g) => $(GROUPS[g]).checked;
  LAYERS.forEach(([id, g]) => {
    if (!map.getLayer(id)) return;
    if (g === "app") {
      // the "top" toggle filters top-ranked outlines out of appellation layers
      map.setLayoutProperty(id, "visibility", on("app") || on("top") ? "visible" : "none");
    } else map.setLayoutProperty(id, "visibility", on(g) ? "visible" : "none");
  });
  const rankFilter = on("app") && on("top") ? null : on("top") ? ["in", ["get", "rank"], ["literal", TOP]] : ["!", ["in", ["get", "rank"], ["literal", TOP]]];
  LAYERS.filter(([, g]) => g === "app").forEach(([id]) => {
    if (!map.getLayer(id)) return;
    const baseF = id.startsWith("ov-") && id !== "ov-labels" ? ["any", ["!=", ["get", "src"], "inao"], ["<", ["zoom"], 10.5]] :
      id === "ov-labels" ? ["any", ["!=", ["get", "src"], "inao"], ["<", ["zoom"], 10.5]] : null;
    const parts = [baseF, rankFilter].filter(Boolean);
    map.setFilter(id, parts.length ? (parts.length === 1 ? parts[0] : ["all", ...parts]) : null);
  });
}
Object.values(GROUPS).forEach((id) => $(id).addEventListener("change", applyLegend));


// ---------- glossary and guide
const GLOSS = {
  appellation: ["Appellation", "A protected name of origin with legal rules: the delimited area, grapes, maximum yield, planting density and how the wine is made. In the EU these are all Protected Designations of Origin (PDO): AOC/AOP in France, DOC and DOCG in Italy, DO, DOCa and Vino de Pago in Spain, g.U. in Germany. On this map each outline is the legally delimited area."],
  region: ["Wine region (Anbaugebiet)", "One of Germany's 13 regions for quality wine, such as Mosel or Rheingau. Every German quality wine must name its Anbaugebiet."],
  subzone: ["Sub-zone", "A named part of an appellation that may appear on the label. Examples: the premier cru area of a Burgundy village, Côtes de Bordeaux Blaye, a Muscadet cru communal, or a German Großlage."],
  vineyard: ["Climat or vineyard site", "A precisely delimited, named vineyard. In Burgundy these are climats, recorded in many cases since the Middle Ages and inscribed as UNESCO World Heritage in 2015. In Germany they are Einzellagen in the official register."],
  vineyard_area: ["Vineyard area", "Land mapped as vineyard in OpenStreetMap. It shows where vines grow, not a legal boundary."],
  grand_cru: ["Grand cru", "In Burgundy the top of four levels: regional, village, premier cru, grand cru. Each Burgundy grand cru is its own appellation, so the label shows only the vineyard name, such as Chambertin. Alsace has 51 grand cru appellations. In Chablis one grand cru appellation covers seven climats. In Champagne the term applies to whole villages."],
  premier_cru: ["Premier cru", "Burgundy's second tier. A premier cru sits inside a village appellation and is written after it: Gevrey-Chambertin premier cru Clos Saint-Jacques. Wine from several premier cru climats of one village may be blended and sold simply as premier cru."],
  docg: ["DOCG", "Denominazione di Origine Controllata e Garantita, Italy's top tier above DOC. Rules are stricter and every wine is tasted and approved before release."],
  doca: ["DOCa", "Denominación de Origen Calificada, Spain's top tier above DO. Only Rioja and Priorat (DOQ in Catalan) hold it."],
  pago: ["Vino de Pago", "A Spanish appellation for a single estate with a distinctive terroir. The estate itself is the appellation."],
  einzellage: ["Einzellage", "A registered single vineyard in Germany. On the label it follows the village name in adjectival form: Wehlener Sonnenuhr is the Sonnenuhr site of Wehlen. The VDP growers' association uses its own private ranking (Grosse Lage, Erste Lage), which is separate from this official register."],
  grosslage: ["Großlage", "A group of neighbouring Einzellagen that may share one name on the label, such as Piesporter Michelsberg. Because it reads like a single site it is often criticised, and recent German wine law limits how it can be used."],
  climate: ["Climate", "Daily weather from 1991 to 2025 for the centre of the place, from the ERA5-Land reanalysis (about 9 km cells) served by Open-Meteo, adjusted to the measured elevation. Growing season means April to October in the northern hemisphere. Growing degree days (Winkler) add up each day's mean above 10 °C. The Huglin index weights daytime warmth from April to September and the latitude. Typical grape matches follow the growing season temperature bands of Gregory Jones (2006). A vintage's warmth rank compares it with all seasons since 1991."],
  soil: ["Soil", "Soil texture (sand, silt, clay), pH, stones and organic carbon from SoilGrids 2.0 by ISRIC, a global soil model at 250 m. Topsoil is 0 to 30 cm, subsoil 30 to 100 cm. Vineyard soils change over a few metres, so treat this as the soil family of the area, then check local soil maps."],
  ava: ["AVA", "American Viticultural Area: a grape-growing region defined by the US Alcohol and Tobacco Tax and Trade Bureau (TTB) in 27 CFR part 9. If an AVA appears on the label, at least 85% of the grapes come from it. AVAs can sit inside larger AVAs, like Oakville inside Napa Valley."],
  terrain: ["Terrain", "Elevation, slope and aspect are measured live from open elevation models served by Mapterhorn: IGN RGE ALTI in France, DGM1 lidar in Germany, swissALTI3D in Switzerland, IGN MDT in Spain, regional models in parts of Italy, and Copernicus GLO-30 (30 m) elsewhere. Slope uses the Horn method on each cell. Aspect is the compass direction the ground faces, counted only where the slope is 2° or more. The rose shows how much of the place faces each direction. For a large appellation the cells are coarse, so read slope and aspect on single vineyards."],
  bedrock: ["Regional bedrock", "Rock type under the place, sampled from the Global Lithological Map by Hartmann and Moosdorf (2012). The map works at about 1:3.75 million, so it shows the geology of the wider area. Local soils, such as the marl and limestone mosaic of a Burgundy slope, can differ."],
};
function openGloss(key) {
  const g = GLOSS[key];
  if (!g) return;
  openModal('<h2>' + esc(g[0]) + "</h2><p>" + esc(g[1]) + '</p><p><button class="link-btn" id="fullGuide">Open the full guide</button></p>');
  $("fullGuide").onclick = openGuide;
}
function openGuide() {
  const block = (keys) => "<dl class=\"gloss\">" + keys.map((k) => "<dt>" + esc(GLOSS[k][0]) + "</dt><dd>" + esc(GLOSS[k][1]) + "</dd>").join("") + "</dl>";
  openModal("<h2>How to read the atlas</h2>" +
    "<p>Click any outline to open its sheet. Zoom in to go from regions to appellations, then to climats and single vineyards. Gold marks the top classification of each country, copper marks premiers crus.</p>" +
    "<h3>Levels</h3>" + block(["region", "appellation", "subzone", "vineyard"]) +
    "<h3>Classifications</h3>" + block(["grand_cru", "premier_cru", "docg", "doca", "pago", "einzellage", "grosslage"]) +
    "<h3>How precise is each layer</h3><dl class=\"gloss\">" +
    "<dt>France</dt><dd>Official INAO parcel delimitation, dated 31 August 2026. Exact to the cadastral parcel. Champagne and a few others are shown by commune.</dd>" +
    "<dt>Italy and Spain</dt><dd>Appellation outlines built from the communes named in each specification. Single vineyards (MGA, paratges, viñedos singulares) are not mapped yet.</dd>" +
    "<dt>Germany</dt><dd>Official Einzellagen for Mosel, Rheinhessen, Pfalz, Nahe, Mittelrhein and Ahr (register of 6 October 2021). Other regions by outline only.</dd>" +
    "<dt>Switzerland</dt><dd>Swiss AOCs are defined canton by canton, so the canton boundary stands in for the appellation until the cantonal vineyard cadastres are added.</dd>" +
    "<dt>Wine rules</dt><dd>Grapes, yields and planting density from the EU product specifications, compiled by Candiago et al. (2022). Always check the current specification for legal use.</dd>" +
    (WEB ? "<dt>Terrain</dt><dd>" + esc(GLOSS.terrain[1]) + "</dd>" : "") +
    "<dt>Bedrock and wineries</dt><dd>" + esc(GLOSS.bedrock[1]) + " Wineries come from OpenStreetMap and are as complete as its volunteers made them.</dd></dl>");
}
document.addEventListener("click", (e) => { const q = e.target.closest("[data-gloss]"); if (q) { e.stopPropagation(); openGloss(q.dataset.gloss); } });
$("openGuide").onclick = openGuide;
$("openVintages").onclick = () => openVintages();

// ---------- modal: open data + suggestions
function openModal(html, wide) { $("modalCard").className = "card" + (wide ? " wide" : ""); $("modalCard").innerHTML = '<button class="x" id="mclose" aria-label="Close">✕</button>' + html; $("modal").hidden = false; $("mclose").onclick = closeModal; }
function closeModal() { $("modal").hidden = true; }
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
function openData() {
  const counts = {};
  INDEX.forEach((r) => { counts[r[2]] = (counts[r[2]] || 0) + 1; });
  openModal("<h2>Open data &amp; sources</h2><p>Every outline on this map comes from an official or community register published under an open licence. " +
    "The atlas keeps one simple schema for all countries, so anyone can add a region by converting one more dataset.</p>" +
    '<div class="tbl"><table><tr><th>Layer</th><th>Source</th><th>Licence</th></tr>' +
    [["France: AOC, premiers crus, climats (parcel level)", "inao"], ["Italy, Spain, Germany and 17 more EU countries: PDO outlines (communes)", "eupdo"],
     ["Germany: Einzellagen and Großlagen", "rlp"], ["Switzerland: cantonal AOC outlines", "bfs"], ["Wineries, Swiss vineyards, rivers, lakes", "osm"]]
      .concat([["United States: AVAs", "ava"]])
      .concat(WEB ? [["Relief, elevation, slope and aspect", "dem"], ["Climate and vintage weather", "meteo"], ["Soil", "soil"], ["Satellite map", "eox"], ["Topographic map", "otm"]] : [])
      .map(([l, k]) => "<tr><td>" + l + '</td><td><a href="' + SOURCES[k].url + '" target="_blank" rel="noopener">' + esc(SOURCES[k].name) + "</a></td><td>" + esc(SOURCES[k].license) + "</td></tr>").join("") +
    "</table></div>" +
    '<p class="note">Places per country: ' + Object.entries(counts).map(([c, n]) => c + " " + fmt(n)).join(" · ") +
    ". Country borders: Natural Earth (public domain). Label font: Noto Sans (OFL). DOCG and Pago flags follow public lists and can be corrected by anyone.</p>" +
    "<p><b>Schema.</b> Every place has <span class=\"num\">id, name, country, level, rank, parent, src</span>. Levels run region → appellation → sub-zone → vineyard site.</p>");
}
$("openData").onclick = openData; $("attribMore").onclick = openData;

let dbPromise = null;
function getDb() {
  if (!dbPromise) dbPromise = (window.claude && window.claude.use) ? window.claude.use("db").catch(() => null) : Promise.resolve(null);
  return dbPromise;
}
async function openSuggest(p) {
  openModal("<h2>Suggest " + (p ? "a correction" : "a place") + "</h2>" +
    "<p>Add a missing vineyard, fix a boundary or a classification. Every suggestion is reviewed before it enters the open dataset. Please name your source.</p>" +
    '<form class="suggest" id="sform">' +
    '<label for="s-place">Place<input id="s-place" required maxlength="120" value="' + esc(p ? p.name : "") + '"></label>' +
    '<label for="s-kind">Type<select id="s-kind"><option>Correction</option><option>Missing place</option><option>Classification</option><option>Boundary</option><option>Producer / winery</option></select></label>' +
    '<label for="s-text">What should change<textarea id="s-text" required maxlength="2000" placeholder="For example: Barolo MGA Cannubi is missing. Boundary per Disciplinare art. 1."></textarea></label>' +
    '<label for="s-src">Source (link or document)<input id="s-src" maxlength="300" placeholder="https://…"></label>' +
    '<button class="primary" type="submit">Send suggestion</button><div class="note" id="s-msg"></div></form>' +
    '<div class="sec"><h3>Recent suggestions</h3><div class="queue" id="queue"><span class="note">Loading…</span></div></div>');
  const db = WEB ? null : await getDb();
  const queue = $("queue");
  if (WEB) { queue.innerHTML = '<span class="note">Suggestions open as a GitHub issue, where anyone can follow the review. <a href="' + REPO + '/issues" target="_blank" rel="noopener">See open suggestions</a>.</span>'; }
  else if (!db) { queue.innerHTML = '<span class="note">Suggestions are stored when you open the atlas signed in to Claude. You can still copy your text and send it to the maintainers.</span>'; }
  else {
    const unsub = db.collection("suggestions").orderBy("at", "desc").limit(8).onSnapshot((snap) => {
      queue.innerHTML = snap.docs.length ? snap.docs.map((d) => { const x = d.data(); return "<div><b>" + esc(x.place) + "</b> · " + esc(x.kind) + '<br><span class="note">' + esc(String(x.text).slice(0, 160)) + "</span></div>"; }).join("")
        : '<span class="note">No suggestions yet. Yours can be the first.</span>';
    }, () => { queue.innerHTML = '<span class="note">Could not load suggestions.</span>'; });
    const stop = () => { try { unsub(); } catch (e) {} };
    $("mclose").addEventListener("click", stop, { once: true });
  }
  $("sform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("s-msg");
    const doc = { place: $("s-place").value.trim(), kind: $("s-kind").value, text: $("s-text").value.trim(), source: $("s-src").value.trim(),
      placeId: p ? p.id : "", at: new Date().toISOString(), status: "open" };
    if (WEB) {
      const body = "**Place:** " + doc.place + (doc.placeId ? " (`" + doc.placeId + "`)" : "") + "\n**Type:** " + doc.kind + "\n\n" + doc.text + "\n\n**Source:** " + (doc.source || "none given");
      window.open(REPO + "/issues/new?labels=suggestion&title=" + encodeURIComponent(doc.kind + ": " + doc.place) + "&body=" + encodeURIComponent(body), "_blank", "noopener");
      msg.textContent = "GitHub opens in a new tab. Check the text and submit the issue there.";
      return;
    }
    if (!db) { msg.textContent = "Not saved: this view has no shared storage. Copy your text and send it to the maintainers."; return; }
    try { await db.collection("suggestions").add(doc); msg.textContent = "Thank you. Your suggestion is in the review queue."; $("s-text").value = ""; $("s-src").value = ""; }
    catch (err) { msg.textContent = "Not saved: you need contributor access to this atlas. Ask the owner to invite you."; }
  });
}
$("openSuggest").onclick = () => openSuggest(null);

// ---------- boot
map.on("load", async () => {
  try {
    showLoading("Loading the atlas…");
    const [m, idx] = await Promise.all([fetch("data/manifest.json").then((r) => r.json()), fetch("data/search.json").then((r) => r.json()),
      loadArchive("base.pmtiles")]);
    manifest = m;
    INDEX = idx;
    INDEX.forEach((r) => {
      r._k = norm(r[0] + (r[7] ? " " + r[7] : ""));
      byId.set(r[1], r);
      if (!byName.has(r._k) || r[3] === "appellation") byName.set(r._k, r);
      if (r[5]) { const k = norm(r[5]); if (!children.has(k)) children.set(k, []); children.get(k).push(r); }
    });
    children.forEach((list) => list.sort((a, b) => (PRI[b[3]] - PRI[a[3]]) || ((TOP.includes(b[4]) ? 2 : b[4] === "premier_cru" ? 1 : 0) - (TOP.includes(a[4]) ? 2 : a[4] === "premier_cru" ? 1 : 0)) || a[0].localeCompare(b[0])));
    $("count").textContent = fmt(INDEX.length);
    addBase();
    if (WEB) { addRelief(); addRasters(); }
    hideLoading();
    showLoading("Loading appellations…");
    await loadArchive("overview.pmtiles");
    addOverview();
    bindHover(["ov-fill"]);
    hideLoading();
    showLoading("Loading wineries…");
    await loadArchive("poi.pmtiles");
    addPoi();
    hideLoading();
    applyLegend();
    ensureDetail();
    map.on("moveend", ensureDetail);
    if (WEB) { setBase(store.get("base") || "dark"); setOverlay(store.get("overlay") || "relief"); }
    // deep link: #<place id>
    const hid = decodeURIComponent(location.hash.slice(1));
    if (hid && byId.has(hid)) goTo(byId.get(hid));
  } catch (e) {
    console.error(e);
    $("loading").textContent = "The map data could not load. Reload the page to try again.";
  }
});
})();
</script>
